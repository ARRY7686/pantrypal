# Registry that holds both images: ghcr.io/<github-owner> in CI, empty for locally loaded images.
image:
  registry: ghcr.io/arry7686
  pullPolicy: IfNotPresent

backend:
  image:
    repository: pantrypal-backend
    tag: latest            # CI overrides this with the commit SHA
  replicaCount: 2
  port: 8000
  expiringSoonDays: 3
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

frontend:
  image:
    repository: pantrypal-frontend
    tag: latest            # CI overrides this with the commit SHA
  replicaCount: 2
  port: 8080
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { cpu: 200m, memory: 64Mi }

postgres:
  image: postgres:16-alpine
  database: pantrypal
  username: pantrypal
  # Demo value. For a real cluster pass --set postgres.password=... or use an external secret.
  password: change-me-pantrypal
  storage: 1Gi

ingress:
  enabled: true
  className: nginx
  host: pantrypal.local

hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

monitoring:
  # Requires the Prometheus Operator CRDs (kube-prometheus-stack).
  serviceMonitor:
    enabled: false
    labels:
      release: kube-prometheus-stack
  # ConfigMap picked up by the Grafana dashboard sidecar.
  grafanaDashboard:
    enabled: false
