apiVersion: v1
kind: Service
metadata:
  name: {{ include "pantrypal.fullname" . }}-frontend
  labels:
    {{- include "pantrypal.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    {{- include "pantrypal.selector" (dict "root" . "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
