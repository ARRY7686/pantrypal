apiVersion: v1
kind: Service
metadata:
  name: {{ include "pantrypal.fullname" . }}-backend
  labels:
    {{- include "pantrypal.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    {{- include "pantrypal.selector" (dict "root" . "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
