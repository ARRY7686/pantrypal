name: PantryPal CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  backend-tests:
    name: Backend lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Run pytest (fails the build on any test failure)
        run: pytest -v --junitxml=test-results.xml --cov=app --cov-report=term-missing

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.xml
          retention-days: 7

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  build-scan-push:
    name: Build, scan and push ${{ matrix.component }} image
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name (GHCR needs a lowercase owner)
        run: echo "IMAGE=${REGISTRY}/${OWNER,,}/pantrypal-${{ matrix.component }}:${{ github.sha }}" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Build image (tagged with the commit SHA, never latest)
        run: docker build -t "$IMAGE" ./${{ matrix.component }}

      - name: Trivy scan (fail on fixable HIGH/CRITICAL CVEs)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.75.0 image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            "$IMAGE"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !env.ACT
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !env.ACT
        run: docker push "$IMAGE"

  deploy:
    name: Deploy with Helm
    needs: build-scan-push
    # Runs only when a cluster is connected: set the repo variable DEPLOY_ENABLED=true
    # and the secret KUBE_CONFIG (a base64-encoded kubeconfig, e.g. from `aws eks update-kubeconfig`).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Helm upgrade
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          kubectl apply -f k8s/namespace.yaml
          helm upgrade --install pantrypal ./helm/pantrypal \
            --namespace pantrypal \
            --set image.registry="ghcr.io/${OWNER,,}" \
            --set backend.image.tag=${{ github.sha }} \
            --set frontend.image.tag=${{ github.sha }} \
            --wait --timeout 5m
          kubectl get pods -n pantrypal
